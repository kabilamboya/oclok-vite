<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">O!clok product placeholder</title>
  <desc id="desc">A neutral placeholder illustration for O!clok store items with missing product images.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff4ea"/>
      <stop offset="100%" stop-color="#ffe0bf"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="120" y="120" width="560" height="560" rx="52" fill="url(#card)"/>
  <rect x="185" y="210" width="430" height="260" rx="24" fill="#ff7a00" opacity="0.18"/>
  <circle cx="400" cy="290" r="90" fill="#ff7a00" opacity="0.9"/>
  <path d="M400 225 L445 285 L400 365 L355 285 Z" fill="#fff7f0"/>
  <rect x="260" y="410" width="280" height="34" rx="17" fill="#ff7a00" opacity="0.9"/>
  <rect x="310" y="470" width="180" height="18" rx="9" fill="#f3f4f6" opacity="0.9"/>
  <text x="400" y="560" text-anchor="middle" font-size="38" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff" font-weight="700">O!clok</text>
</svg>
